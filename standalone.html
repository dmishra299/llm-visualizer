<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Inside a Tiny Transformer — Interactive LLM Visualizer</title>
<style>
:root {
  --bg: #f7f8fa;
  --panel: #ffffff;
  --ink: #1a2332;
  --muted: #5b6474;
  --line: #e2e6ec;
  --accent: #2456d6;
  --accent-soft: #e8eefc;
  --pos: #2456d6;
  --neg: #c2481f;
  --warn-bg: #fff6e5;
  --warn-line: #e8c76a;
  --ok: #1c7a4d;
  --radius: 10px;
  --mono: "SFMono-Regular", ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.45;
}
button, input, select { font-family: inherit; font-size: 13px; }
button { cursor: pointer; }

/* ---------- Header ---------- */
.app-header {
  display: flex; align-items: center; gap: 14px;
  padding: 10px 16px;
  background: var(--panel);
  border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 50;
  flex-wrap: wrap;
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark {
  width: 30px; height: 30px; border-radius: 8px;
  background: var(--ink); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-family: var(--mono); font-weight: 700; font-size: 15px;
}
.brand h1 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: 0.1px; }
.brand small { display: block; color: var(--muted); font-weight: 400; font-size: 11.5px; }
.mode-tabs { display: flex; gap: 6px; margin-left: 8px; }
.mode-tab {
  border: 1px solid var(--line); background: #fff; color: var(--muted);
  padding: 7px 14px; border-radius: 999px; font-weight: 600;
}
.mode-tab.active { background: var(--ink); color: #fff; border-color: var(--ink); }
.header-spacer { flex: 1; }
.header-actions { display: flex; gap: 8px; align-items: center; }
.btn {
  border: 1px solid var(--line); background: #fff; color: var(--ink);
  padding: 7px 12px; border-radius: 8px; font-weight: 600;
}
.btn:hover { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(0.93); color: #fff; }
.btn.ghost { background: transparent; }
.btn.small { padding: 4px 9px; font-size: 12px; border-radius: 7px; }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.seed-chip {
  display: flex; align-items: center; gap: 6px;
  font-family: var(--mono); font-size: 12px; color: var(--muted);
  border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; background: #fff;
}
.seed-chip input { width: 64px; border: none; outline: none; font-family: var(--mono); font-size: 12px; }

/* ---------- Config bar ---------- */
.config-bar {
  display: flex; gap: 10px; align-items: end; flex-wrap: wrap;
  padding: 10px 16px; background: var(--panel);
  border-bottom: 1px solid var(--line);
}
.cfg { display: flex; flex-direction: column; gap: 3px; }
.cfg label { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); font-weight: 700; }
.cfg select, .cfg input[type="number"] {
  border: 1px solid var(--line); border-radius: 7px; padding: 5px 7px; background: #fff; min-width: 76px;
}
.cfg input[type="range"] { width: 130px; accent-color: var(--accent); }
.cfg .val { font-family: var(--mono); font-size: 12px; }
.config-error {
  display: none; background: #fdeeee; border: 1px solid #e8a08a; color: #8f2b12;
  border-radius: 8px; padding: 6px 10px; font-size: 12.5px; font-weight: 600;
}
.config-error.show { display: block; }

/* ---------- Layout ---------- */
.layout {
  display: grid;
  grid-template-columns: 212px minmax(0, 1fr) 300px;
  gap: 12px;
  padding: 12px 16px;
  align-items: start;
}
@media (max-width: 1100px) {
  .layout { grid-template-columns: 190px minmax(0, 1fr); }
  .explain-col { grid-column: 1 / -1; }
}
@media (max-width: 760px) {
  .layout { grid-template-columns: 1fr; }
  .pipe-col { order: 2; } .main-col { order: 1; } .explain-col { order: 3; }
}
.panel {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: var(--radius); padding: 12px;
}
.panel h2 {
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.7px;
  color: var(--muted); margin: 0 0 10px; font-weight: 750;
}

/* ---------- Pipeline nav ---------- */
.pipe-list { display: flex; flex-direction: column; gap: 4px; }
.pipe-item {
  display: flex; gap: 9px; align-items: center; text-align: left;
  border: 1px solid transparent; background: transparent;
  padding: 7px 8px; border-radius: 8px; color: var(--ink); width: 100%;
}
.pipe-item:hover { background: var(--accent-soft); }
.pipe-item.active { background: var(--accent-soft); border-color: #bcd0f5; }
.pipe-item.done .pipe-num { background: var(--ok); }
.pipe-num {
  min-width: 22px; height: 22px; border-radius: 50%;
  background: #c9d2e0; color: #fff; font-size: 11.5px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}
.pipe-item.active .pipe-num { background: var(--accent); }
.pipe-item .t { font-weight: 600; font-size: 13px; }
.pipe-item .s { display: block; font-family: var(--mono); font-size: 10.5px; color: var(--muted); font-weight: 400; }

/* ---------- Stage nav ---------- */
.stage-nav {
  display: flex; align-items: center; gap: 8px; margin-bottom: 10px; flex-wrap: wrap;
}
.stage-pos { font-family: var(--mono); font-size: 12.5px; color: var(--muted); }
.stage-title { font-size: 16px; font-weight: 700; margin: 2px 0 2px; }
.stage-sub { color: var(--muted); font-size: 12.5px; margin: 0 0 10px; }

/* ---------- Visual primitives ---------- */
.token-chip {
  display: inline-flex; align-items: center; gap: 6px;
  border: 1px solid var(--line); background: #fff; border-radius: 999px;
  padding: 4px 11px; margin: 2px; font-weight: 600; font-size: 13px;
}
.token-chip .id { font-family: var(--mono); font-size: 11px; color: var(--muted); font-weight: 400; }
.token-chip.new { border-color: var(--accent); background: var(--accent-soft); }
.token-chip.qsel { border-color: var(--accent); background: var(--ink); color: #fff; }
.token-chip.qsel .id { color: #cfd8ea; }
.token-chip.clickable { cursor: pointer; }
.shape-badge {
  display: inline-block; font-family: var(--mono); font-size: 11.5px;
  background: #eef1f6; border: 1px solid var(--line); border-radius: 6px;
  padding: 2px 7px; margin: 2px 4px 2px 0; white-space: nowrap;
}
.op-box {
  border: 1.5px solid var(--ink); border-radius: 9px; padding: 8px 14px;
  font-weight: 700; display: inline-block; background: #fff; font-size: 13px;
}
.tensor-box {
  border: 1px solid var(--line); border-radius: 9px; padding: 8px 12px;
  background: #fbfcfe; display: inline-block; font-family: var(--mono); font-size: 12px;
}
.flow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
.arrow { color: var(--muted); font-weight: 700; }
.eq-block {
  font-family: var(--mono); font-size: 12.5px; background: #f3f5f9;
  border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px;
  margin: 8px 0; overflow-x: auto; white-space: nowrap;
}
.simplify-note {
  background: var(--warn-bg); border: 1px solid var(--warn-line);
  border-radius: 8px; padding: 7px 11px; font-size: 12.5px; margin: 8px 0;
}
.simplify-note b { font-size: 11px; text-transform: uppercase; letter-spacing: 0.4px; }
.row-sum { font-family: var(--mono); font-size: 11.5px; color: var(--ok); font-weight: 700; }

/* ---------- Matrices ---------- */
.matrix-wrap { overflow: auto; margin: 8px 0; border: 1px solid var(--line); border-radius: 9px; background: #fff; }
table.matrix { border-collapse: collapse; font-family: var(--mono); font-size: 11.5px; }
table.matrix th, table.matrix td { border: 1px solid #eef1f5; padding: 4px 7px; text-align: right; min-width: 62px; }
table.matrix th { background: #f3f5f9; color: var(--muted); font-weight: 700; text-align: center; position: sticky; top: 0; }
table.matrix th.rowlab, table.matrix td.rowlab {
  text-align: left; background: #f3f5f9; color: var(--ink); font-weight: 700;
  position: sticky; left: 0; max-width: 150px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
table.matrix td.hl-row { outline: 2px solid var(--accent); outline-offset: -2px; }
table.matrix td.hl-col { outline: 2px solid #7a4fd0; outline-offset: -2px; }
table.matrix td.masked { color: #9aa3b2; font-style: italic; }
table.matrix td:hover { outline: 2px solid var(--ink); outline-offset: -2px; }
.legend { display: flex; gap: 12px; align-items: center; font-size: 11.5px; color: var(--muted); margin: 4px 0 8px; flex-wrap: wrap; }
.legend .sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }

/* ---------- Bars ---------- */
.bars { display: flex; flex-direction: column; gap: 3px; margin: 8px 0; }
.bar-row { display: grid; grid-template-columns: 92px 1fr 74px; gap: 8px; align-items: center; font-size: 12px; }
.bar-row .tok { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: right; }
.bar-row .num { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
.bar-track { background: #eef1f6; border-radius: 4px; height: 14px; position: relative; overflow: hidden; }
.bar-fill { background: var(--accent); height: 100%; border-radius: 4px; transition: width 0.25s ease; }
.bar-row.kept .bar-fill { background: var(--accent); }
.bar-row.cut .bar-fill { background: #c3cad6; }
.bar-row.cut { opacity: 0.55; }
.bar-row.selected .tok { color: var(--accent); font-weight: 800; }
.bar-row.selected .bar-fill { background: var(--ink); }

/* ---------- Controls / misc ---------- */
.controls-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
.input-text {
  width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px;
  font-size: 14px; resize: vertical; min-height: 40px; font-family: inherit;
}
.subtabs { display: flex; gap: 6px; margin: 8px 0; flex-wrap: wrap; }
.subtab { border: 1px solid var(--line); background: #fff; border-radius: 7px; padding: 5px 11px; font-weight: 600; color: var(--muted); }
.subtab.active { background: var(--ink); color: #fff; border-color: var(--ink); }
.head-pills { display: flex; gap: 6px; margin: 6px 0; flex-wrap: wrap; }
.explain-box h3 { font-size: 12px; margin: 10px 0 3px; color: var(--ink); }
.explain-box h3:first-child { margin-top: 0; }
.explain-box p { margin: 0 0 4px; font-size: 13px; color: #2c3648; }
.explain-box .more { display: none; font-size: 12.5px; color: var(--muted); border-left: 3px solid var(--line); padding-left: 9px; margin-top: 6px; }
.explain-box .more.show { display: block; }
.link-btn { background: none; border: none; color: var(--accent); font-weight: 700; padding: 2px 0; font-size: 12.5px; }
.link-btn:hover { text-decoration: underline; }
.insp-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 6px; margin: 8px 0; }
.insp-stat { background: #f6f8fb; border: 1px solid var(--line); border-radius: 7px; padding: 5px 9px; }
.insp-stat .k { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; color: var(--muted); font-weight: 700; }
.insp-stat .v { font-family: var(--mono); font-size: 12.5px; }
.gen-history { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; max-height: 260px; overflow: auto; }
.hist-step {
  border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; background: #fff;
  cursor: pointer; font-size: 12.5px;
}
.hist-step:hover { border-color: var(--accent); }
.hist-step.active { border-color: var(--accent); background: var(--accent-soft); }
.hist-step .step { font-family: var(--mono); color: var(--muted); font-size: 11px; margin-right: 8px; }
.hist-step .newtok { font-weight: 800; color: var(--accent); }
.block-stack { display: flex; flex-direction: column; gap: 4px; align-items: stretch; margin: 8px 0; }
.block-card { border: 1.5px solid var(--line); border-radius: 9px; padding: 9px 12px; background: #fff; cursor: pointer; }
.block-card.active { border-color: var(--accent); background: var(--accent-soft); }
.block-card .bt { font-weight: 700; }
.block-card .bs { font-family: var(--mono); font-size: 11px; color: var(--muted); }
.block-arrow { text-align: center; color: var(--muted); font-weight: 700; line-height: 1; }
.resid-diagram {
  font-family: var(--mono); font-size: 12px; background: #fbfcfe;
  border: 1px solid var(--line); border-radius: 9px; padding: 10px 14px; white-space: pre; overflow-x: auto;
}
.kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 12.5px; margin: 6px 0; }
.kv .k { color: var(--muted); font-weight: 600; }
.kv .v { font-family: var(--mono); font-size: 12px; }
.calc-box { background: #fbfcfe; border: 1px dashed var(--line); border-radius: 8px; padding: 8px 12px; font-family: var(--mono); font-size: 12px; margin: 8px 0; }
.progress-dots { display: flex; gap: 4px; }
.progress-dots span { width: 22px; height: 5px; border-radius: 3px; background: #dfe4ec; }
.progress-dots span.on { background: var(--accent); }

/* ---------- Bottom inspector ---------- */
.bottom-bar { padding: 0 16px 16px; }
.inspector-body { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 12px; }
@media (max-width: 900px) { .inspector-body { grid-template-columns: 1fr; } }
.tensor-list { display: flex; flex-direction: column; gap: 3px; max-height: 300px; overflow: auto; }
.tensor-btn { text-align: left; border: 1px solid var(--line); background: #fff; border-radius: 7px; padding: 6px 9px; }
.tensor-btn:hover { border-color: var(--accent); }
.tensor-btn.active { background: var(--ink); color: #fff; border-color: var(--ink); }
.tensor-btn .sh { font-family: var(--mono); font-size: 10.5px; opacity: 0.7; display: block; }

/* ---------- Modal ---------- */
.modal-back {
  position: fixed; inset: 0; background: rgba(20, 28, 44, 0.45);
  display: none; align-items: center; justify-content: center; z-index: 100; padding: 20px;
}
.modal-back.show { display: flex; }
.modal {
  background: #fff; border-radius: 12px; max-width: 640px; width: 100%;
  max-height: 85vh; overflow: auto; padding: 20px 22px;
}
.modal h2 { margin: 0 0 8px; font-size: 17px; }
.modal p, .modal li { font-size: 13px; color: #2c3648; }
.modal pre { white-space: pre-wrap; font-size: 12.5px; background: #f3f5f9; padding: 10px; border-radius: 8px; font-family: var(--sans); }
.test-row { display: flex; gap: 8px; align-items: baseline; font-size: 12.5px; padding: 3px 0; border-bottom: 1px solid #f0f2f6; }
.test-row .pass { color: var(--ok); font-weight: 800; }
.test-row .fail { color: #b3271e; font-weight: 800; }

/* ---------- SVG helpers ---------- */
svg text { font-family: var(--mono); }
.gelu-plot { border: 1px solid var(--line); border-radius: 9px; background: #fff; }
.attn-flow { display: flex; align-items: stretch; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
.attn-node {
  border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; background: #fbfcfe;
  font-family: var(--mono); font-size: 11.5px; text-align: center; cursor: pointer;
}
.attn-node:hover, .attn-node.active { border-color: var(--accent); background: var(--accent-soft); }

.flash { animation: flash 0.6s ease; }
@keyframes flash { 0% { background: var(--accent-soft); } 100% { background: #fff; } }
@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>

<header class="app-header">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">T</div>
    <h1>Inside a Tiny Transformer<small>an interactive simulator of Transformer inference</small></h1>
  </div>
  <nav class="mode-tabs" aria-label="Learning mode">
    <button class="mode-tab active" id="tabEncoder" aria-pressed="true">A · Attention Explorer</button>
    <button class="mode-tab" id="tabDecoder" aria-pressed="false">B · GPT-style Generator</button>
  </nav>
  <div class="header-spacer"></div>
  <div class="header-actions">
    <label class="seed-chip" title="Master seed: same input + config + seed reproduces every number">
      seed <input id="seedInput" type="number" value="42" min="0" max="999999" aria-label="Random seed" />
    </label>
    <button class="btn small" id="aboutBtn">About this simulator</button>
    <button class="btn small" id="testsBtn">Run tests</button>
  </div>
</header>

<div class="config-bar" id="configBar" aria-label="Model configuration"></div>
<div style="padding:0 16px"><div class="config-error" id="configError" role="alert"></div></div>

<main class="layout">
  <aside class="panel pipe-col" aria-label="Pipeline stages">
    <h2>Pipeline</h2>
    <div class="pipe-list" id="pipeList"></div>
  </aside>

  <section class="panel main-col" aria-label="Main visualization">
    <div class="stage-nav">
      <button class="btn small" id="prevBtn" aria-label="Previous stage">← Prev</button>
      <button class="btn small" id="playBtn" aria-label="Auto-play stages">▶ Play</button>
      <button class="btn small primary" id="nextBtn" aria-label="Next stage">Next →</button>
      <span class="stage-pos" id="stagePos"></span>
      <div class="progress-dots" id="progressDots" aria-hidden="true"></div>
    </div>
    <h2 class="stage-title" id="stageTitle"></h2>
    <p class="stage-sub" id="stageSub"></p>
    <div id="stageView"></div>
  </section>

  <aside class="panel explain-col" aria-label="Explanation">
    <h2>Explanation</h2>
    <div class="explain-box" id="explainBox"></div>
  </aside>
</main>

<div class="bottom-bar">
  <section class="panel" aria-label="Tensor inspector">
    <h2>Tensor Inspector — one source of truth: every number below comes from the same computation as the visualization above</h2>
    <div class="inspector-body">
      <div class="tensor-list" id="tensorList" role="listbox" aria-label="Tensors"></div>
      <div id="tensorDetail"></div>
    </div>
  </section>
</div>

<div class="modal-back" id="modalBack">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h2 id="modalTitle"></h2>
    <div id="modalBody"></div>
    <div class="controls-row" style="margin-top:12px">
      <button class="btn" id="modalClose">Close</button>
    </div>
  </div>
</div>

<script>
(() => {
  // js/engine.js
  function fnv1a(str) {
    let hash = 2166136261;
    for (let i = 0; i < str.length; i++) {
      hash ^= str.charCodeAt(i);
      hash = Math.imul(hash, 16777619) >>> 0;
    }
    return hash >>> 0;
  }
  function mulberry32(seed) {
    let a = seed >>> 0;
    return function() {
      a |= 0;
      a = a + 1831565813 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function streamRng(seed, salt) {
    return mulberry32((seed >>> 0 ^ fnv1a(String(salt))) >>> 0);
  }
  function randn(rng) {
    let u1 = 0;
    while (u1 === 0) u1 = rng();
    const u2 = rng();
    const r = Math.sqrt(-2 * Math.log(u1));
    const theta = 2 * Math.PI * u2;
    return r * Math.cos(theta);
  }
  var BASE_VOCAB = [
    "The",
    "cat",
    "sat",
    "on",
    "mat",
    "dog",
    "ran",
    "a",
    "the",
    "and",
    "is",
    "was",
    "it",
    "to",
    "in",
    "he",
    "she",
    "we",
    "they",
    "you",
    "I",
    "man",
    "woman",
    "child",
    "bird",
    "fish",
    "tree",
    "house",
    "car",
    "book",
    "sun",
    "moon",
    "star",
    "sky",
    "sea",
    "fire",
    "water",
    "earth",
    "wind",
    "day",
    "night",
    "light",
    "dark",
    "big",
    "small",
    "red",
    "blue",
    "green",
    "happy",
    "sad",
    "fast",
    "slow",
    "up",
    "down",
    "over",
    "under",
    "with",
    "at",
    "of",
    "for",
    "from",
    "that",
    "this",
    "not"
  ];
  function buildVocab(vocabSize) {
    const v = [];
    for (let i = 0; i < vocabSize; i++) {
      v.push(i < BASE_VOCAB.length ? BASE_VOCAB[i] : `tok${i}`);
    }
    return v;
  }
  function tokenize(text, vocabSize) {
    const tokens = String(text ?? "").trim().split(/\s+/).filter(Boolean);
    const ids = tokens.map((t) => fnv1a(t) % vocabSize);
    return { tokens, ids };
  }
  function zeros(rows, cols) {
    return Array.from({ length: rows }, () => new Array(cols).fill(0));
  }

  // js/tests.js
  var approx = (a, b, tol = 1e-6) => Math.abs(a - b) <= tol;
  function runTests() {
    const results = [];
    const t = (name, fn) => {
      try {
        fn();
        results.push({ name, pass: true });
      } catch (e) {
        results.push({ name, pass: false, error: String(e?.message ?? e) });
      }
    };
    const assert = (cond, msg) => {
      if (!cond) throw new Error(msg);
    };
    t("FNV-1a: known vector ('hello' -> 1335831723)", () => {
      assert(fnv1a("hello") === 1335831723, `got ${fnv1a("hello")}`);
    });
    t("FNV-1a: empty string -> offset basis", () => {
      assert(fnv1a("") === 2166136261, `got ${fnv1a("")}`);
    });
    t("Tokenization: 'The cat sat' -> 3 tokens, ids in range", () => {
      const { tokens, ids } = tokenize("The cat sat", 32);
      assert(tokens.join("|") === "The|cat|sat", JSON.stringify(tokens));
      assert(ids.length === 3 && ids.every((id) => id >= 0 && id < 32), JSON.stringify(ids));
    });
    t("Tokenization: deterministic (same input -> same ids)", () => {
      const a = tokenize("The cat sat", 32).ids;
      const b = tokenize("The cat sat", 32).ids;
      assert(JSON.stringify(a) === JSON.stringify(b), "not deterministic");
    });
    t("Softmax: rows sum to 1", () => {
      const m = softmax([[1, 2, 3], [-1, 0, 1]]);
      m.forEach((row) => assert(approx(row.reduce((a, b) => a + b, 0), 1, 1e-9), "row != 1"));
    });
    t("Causal mask: future positions get ~0 probability after softmax", () => {
      const scores = [[1, 1, 1], [1, 1, 1], [1, 1, 1]];
      const w = softmax(applyCausalMask(scores));
      assert(w[0][1] < 1e-6 && w[0][2] < 1e-6, JSON.stringify(w[0]));
      assert(w[1][2] < 1e-6 && w[1][0] > 0.4, JSON.stringify(w[1]));
      assert(w[2].every((x) => x > 0.3 && x < 0.35), JSON.stringify(w[2]));
    });
    t("Attention: output shape [seq,dHead]", () => {
      const cfg = { dModel: 8, dFF: 16, nHeads: 2, nLayers: 1, vocabSize: 32 };
      const tr = forwardEncoder("The cat sat", cfg, 42);
      const [seq, dm] = [tr.ids.length, cfg.dModel];
      assert(tr.enc.attn.length === 2, "head count");
      assert(tr.enc.attn[0].output.length === seq && tr.enc.attn[0].output[0].length === dm / 2, "out shape");
      assert(tr.enc.attn[0].weights.length === seq && tr.enc.attn[0].weights[0].length === seq, "weights shape");
    });
    t("Multi-head: split + concat restores [seq,dModel]", () => {
      const X = createMatrix(4, 8, (r, c) => r * 8 + c);
      const { heads } = splitHeads(X, 2);
      assert(heads.length === 2 && heads[0].length === 4 && heads[0][0].length === 4, "split shape");
      assert(JSON.stringify(concatHeads(heads)) === JSON.stringify(X), "concat mismatch");
    });
    t("LayerNorm: normalized rows have ~0 mean, ~1 variance", () => {
      const X = [[1, 2, 3, 4], [5, -2, 0, 3]];
      const g = [1, 1, 1, 1], b = [0, 0, 0, 0];
      const { normalized } = layerNorm(X, g, b);
      normalized.forEach((row) => {
        const mean = row.reduce((a, x) => a + x, 0) / row.length;
        const v = row.reduce((a, x) => a + (x - mean) ** 2, 0) / row.length;
        assert(approx(mean, 0, 1e-9), `mean ${mean}`);
        assert(approx(v, 1, 1e-3), `var ${v}`);
      });
    });
    t("GELU: known values", () => {
      assert(approx(gelu(0), 0, 1e-9), `gelu(0)=${gelu(0)}`);
      assert(approx(gelu(1), 0.8412, 1e-3), `gelu(1)=${gelu(1)}`);
      assert(approx(gelu(-1), -0.1588, 1e-3), `gelu(-1)=${gelu(-1)}`);
    });
    t("Temperature: applied before softmax (lower T sharpens)", () => {
      const logits = [2, 1, 0.5];
      const sharp = softmaxVec(applyTemperature(logits, 0.1));
      const flat = softmaxVec(applyTemperature(logits, 2));
      assert(sharp[0] > 0.99, JSON.stringify(sharp));
      assert(flat[0] < sharp[0] && flat[2] > sharp[2], JSON.stringify(flat));
    });
    t("Top-k: exactly k candidates eligible", () => {
      const probs = [0.5, 0.2, 0.15, 0.1, 0.05];
      const r = topKSample(probs, 3, mulberry32(1));
      assert(r.candidates.filter((c) => c.kept).length === 3, JSON.stringify(r.candidates));
    });
    t("Top-p: kept set reaches cumulative threshold", () => {
      const probs = [0.5, 0.2, 0.15, 0.1, 0.05];
      const r = topPSample(probs, 0.9, mulberry32(1));
      const kept = r.candidates.filter((c) => c.kept);
      const cum = kept.reduce((a, c) => a + c.prob, 0);
      assert(cum >= 0.9 - 1e-9, `cum=${cum}`);
      const sorted = kept.map((c) => c.prob).sort((a, b) => b - a);
      assert(cum - sorted[sorted.length - 1] < 0.9 + 1e-9, "not minimal set");
    });
    t("Greedy: selects argmax", () => {
      const r = greedySample([0.1, 0.7, 0.2]);
      assert(r.selectedId === 1, `got ${r.selectedId}`);
    });
    t("Generation: appending a token grows sequence by 1", () => {
      const cfg = { dModel: 8, dFF: 16, nHeads: 2, nLayers: 2, vocabSize: 32 };
      const a = forwardDecoder([1, 2], ["The", "cat"], cfg, 42);
      const b = forwardDecoder([1, 2, 9], ["The", "cat", "sat"], cfg, 42);
      assert(b.logits.length === a.logits.length + 1, "seq did not grow");
      assert(b.logits[0].length === 32, "logit width != vocab");
    });
    t("Determinism: same input+config+seed -> identical logits", () => {
      const cfg = { dModel: 8, dFF: 16, nHeads: 2, nLayers: 2, vocabSize: 32 };
      const a = forwardDecoder([1, 2], ["The", "cat"], cfg, 42);
      const b = forwardDecoder([1, 2], ["The", "cat"], cfg, 42);
      assert(JSON.stringify(a.logits) === JSON.stringify(b.logits), "logits differ");
    });
    t("Causal attention in decoder: no future leakage", () => {
      const cfg = { dModel: 8, dFF: 16, nHeads: 2, nLayers: 1, vocabSize: 32 };
      const tr = forwardDecoder([3, 7, 11], ["a", "b", "c"], cfg, 7);
      const w = tr.blocks[0].attn[0].weights;
      assert(w[0][1] < 1e-6 && w[0][2] < 1e-6, "row 0 leaks");
      assert(w[1][2] < 1e-6, "row 1 leaks");
      assert(approx(w[2].reduce((x, y) => x + y, 0), 1, 1e-9), "row 2 sum");
    });
    t("Invalid head config throws", () => {
      let threw = false;
      try {
        splitHeads([[1, 2, 3]], 2);
      } catch {
        threw = true;
      }
      assert(threw, "should throw when d_model % n_heads != 0");
    });
    return results;
  }

  // js/app.js
  var S = {

    stage: 0,

    encInput: "The cat sat",
    decPrompt: "The cat",

    attnView: "weights",

    ffnView: "out",
    dffnView: "res",

  var stages = () => S.mode === "encoder" ? ENCODER_STAGES : DECODER_STAGES;
  var explanations = () => S.mode === "encoder" ? ENCODER_EXPLANATIONS : DECODER_EXPLANATIONS;
  function configError() {
    const c = S.config;
    if (c.dModel % c.nHeads !== 0) return `Invalid configuration: d_model (${c.dModel}) must be divisible by n_heads (${c.nHeads}).`;
    return null;
  }
  function recomputeEncoder() {
    const words = S.encInput.trim().split(/\s+/).filter(Boolean);
    S.truncated = words.length > 12;
    const text = S.truncated ? words.slice(0, 12).join(" ") : S.encInput;
    S.encTrace = forwardEncoder(text, S.config, S.config.seed);
  }
  function resetDecoder() {
    const { tokens, ids } = tokenize(S.decPrompt, S.config.vocabSize);
    S.decTokens = tokens.slice(0, 16);
    S.decIds = ids.slice(0, 16);
    S.promptLen = S.decIds.length;
    S.history = [];
    S.sampleCounter = 0;
    S.selHist = -1;
    recomputeDecoder();
  }
  function recomputeDecoder() {
    S.decTrace = forwardDecoder(S.decIds, S.decTokens, S.config, S.config.seed);
    S.decTrace.promptIds = S.decIds.slice(0, S.promptLen);
    if (S.decIds.length) {
      const c = S.config;
      S.decStep = decodeLastPosition(S.decTrace, {
        temperature: c.temperature,
        method: c.method,
        k: c.k,
        p: c.p,
        sampleSeed: c.seed + S.sampleCounter * 1013904223 >>> 0
      });
    } else S.decStep = null;
  }
  function recomputeAll() {
    const err = configError();
    $("configError").textContent = err || "";
    $("configError").classList.toggle("show", !!err);
    if (err) return false;
    recomputeEncoder();
    recomputeDecoder();
    S.selQuery = Math.min(S.selQuery, Math.max(0, (S.mode === "encoder" ? S.encTrace.ids.length : S.decIds.length) - 1));
    S.selHead = Math.min(S.selHead, S.config.nHeads - 1);
    S.selBlock = Math.min(S.selBlock, S.config.nLayers - 1);
    return true;
  }
  function nextToken() {
    if (!S.decStep || S.decIds.length >= 16) return;
    const st = S.decStep, c = S.config;
    const id = st.sampling.selectedId;
    const tok = S.decTrace.vocab[id];
    S.history.push({
      step: S.history.length + 1,
      contextIds: [...S.decIds],
      contextTokens: [...S.decTokens],
      logitsLast: [...st.logitsLast],
      probs: [...st.probs],
      selectedId: id,
      selectedToken: tok,
      method: c.method,
      k: c.k,
      p: c.p,
      temperature: c.temperature
    });
    S.decIds.push(id);

  function wireGelu() {
    const svg = $("geluPlot");
    if (!svg) return;
    const gelu2 = (x) => 0.5 * x * (1 + Math.tanh(Math.sqrt(2 / Math.PI) * (x + 0.044715 * x ** 3)));
    const W = 460, P = 28, minX = -3, maxX = 3;
    const dot = $("geluDot"), out = $("geluReadout");
    svg.addEventListener("mousemove", (ev) => {
      const r = svg.getBoundingClientRect();
      const px = (ev.clientX - r.left) / r.width * W;
      const x = minX + (Math.min(W - P, Math.max(P, px)) - P) / (W - 2 * P) * (maxX - minX);
      const ys = [];
      for (let i = 0; i <= 120; i++) ys.push(gelu2(minX + (maxX - minX) * i / 120));
      const minY = Math.min(...ys), maxY = Math.max(...ys), H = 200;
      const X = (v) => P + (v - minX) / (maxX - minX) * (W - 2 * P);
      const Y = (v) => H - P - (v - minY) / (maxY - minY) * (H - 2 * P);
      dot.setAttribute("cx", X(x));
      dot.setAttribute("cy", Y(gelu2(x)));
      dot.style.display = "block";
      out.textContent = `x=${fmt(x, 3)} \u2192 GELU=${fmt(gelu2(x), 4)}`;
    });
    svg.addEventListener("mouseleave", () => {
      dot.style.display = "none";
    });
  }

  }
  function onAction(action, el) {
    const v = el.dataset.v, i = el.dataset.i !== void 0 ? +el.dataset.i : null;
    switch (action) {
      case "embView":
        S.embView = v;
        break;
      case "qkvTab":
        S.qkvTab = v;
        break;
      case "selHead":
        S.selHead = i;
        break;
      case "selBlock":
        S.selBlock = i;
        break;
      case "selQuery":
        S.selQuery = i;
        break;
      case "attnView":
        S.attnView = v;
        break;
      case "dAttnView":
        S.dAttnView = v;
        break;
      case "ffnView":
        S.ffnView = v;
        break;
      case "dffnView":
        S.dffnView = v;
        break;
      case "resView":
        S.resView = v;
        break;
      case "toggleCalc":
        S.showCalc = !S.showCalc;
        break;
      case "toggleMask":
        S.showMask = !S.showMask;
        break;
      case "topN":
        S.topN = i;
        break;
      case "method":
        S.config.method = v;
        renderConfig();
        break;
      case "k":
        S.config.k = i;
        break;
      case "inspect":
        S.selTensor = el.dataset.tensor;
        renderInspector();
        document.querySelector(".bottom-bar").scrollIntoView({ behavior: "smooth", block: "nearest" });
        return;
      case "explainMore":
        S.showMore = !S.showMore;
        renderExplain();
        return;
      case "explainMath":
        S.showMath = !S.showMath;
        renderExplain();
        return;
      case "nextToken":
        setAutoGen(false);
        nextToken();
        return;
      case "autoGen":
        setAutoGen(!S.autoGen);
        break;
      case "stepBack":
        setAutoGen(false);
        stepBack();
        return;
      case "resetGen":
        setAutoGen(false);
        S.decPrompt = $("decInput")?.value ?? S.decPrompt;
        resetDecoder();
        break;
      case "selHist":
        S.selHist = i;
        break;
      case "applyEncInput":
        S.encInput = $("encInputMini").value;
        break;
      default:
        return;
    }
    renderDynamic();
  }
  var encDebounce = null;
  function initEvents() {
    document.addEventListener("click", (ev) => {
      const st = ev.target.closest("[data-stage]");
      if (st) {
        gotoStage(+st.dataset.stage);
        return;
      }
      const tb = ev.target.closest("[data-tensor]");
      if (tb) {
        S.selTensor = tb.dataset.tensor;
        renderInspector();
        return;
      }
      const a = ev.target.closest("[data-action]");
      if (a) {
        onAction(a.dataset.action, a);
        return;
      }
    });
    document.addEventListener("keydown", (ev) => {
      if (ev.key === "Enter" && ev.target.matches?.('[role="button"][data-action]')) {
        ev.target.click();
        return;
      }
      const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || "");
      if (typing) return;
      if (ev.key === "ArrowRight") gotoStage(S.stage + 1);
      else if (ev.key === "ArrowLeft") gotoStage(S.stage - 1);
      else if ((ev.key === "n" || ev.key === "N") && S.mode === "decoder") {
        setAutoGen(false);
        nextToken();
      }
    });
    document.addEventListener("input", (ev) => {
      const el = ev.target;
      if (el.id === "encInput") {
        S.encInput = el.value;
        clearTimeout(encDebounce);
        encDebounce = setTimeout(renderDynamic, 500);
      } else if (el.id === "encInputMini") {
        S.encInput = el.value;
        clearTimeout(encDebounce);
        encDebounce = setTimeout(() => {
          renderDynamic();
        }, 600);
      } else if (el.id === "decInput") {
        S.decPrompt = el.value;
      } else if (el.dataset.cfgRange) {
        S.config[el.dataset.cfgRange] = +el.value;
        if (el.dataset.cfgRange === "temperature") {
          const t2 = $("tempSlider2");
          if (t2 && t2 !== el) t2.value = el.value;
        }
        renderDynamic();
      } else if (el.dataset.action === "temp") {
        S.config.temperature = +el.value;
        renderDynamic();
      } else if (el.dataset.action === "p") {
        S.config.p = +el.value;
        renderDynamic();
      }
    });
    document.addEventListener("change", (ev) => {
      const el = ev.target;
      if (el.dataset.cfg) {
        const key = el.dataset.cfg;
        S.config[key] = key === "method" ? el.value : +el.value;
        if (["dModel", "dFF", "nHeads", "nLayers", "vocabSize"].includes(key)) {
          setAutoGen(false);
          resetDecoder();
        }
        renderConfig();
        renderDynamic();
      } else if (el.id === "seedInput") {
        S.config.seed = Math.max(0, +el.value || 0);
        setAutoGen(false);
        resetDecoder();
        renderConfig();
        renderDynamic();
      } else if (el.id === "encInput" || el.id === "encInputMini") {
        S.encInput = el.value;
        renderDynamic();
      }
    });
    $("prevBtn").onclick = () => gotoStage(S.stage - 1);
    $("nextBtn").onclick = () => gotoStage(S.stage + 1);
    $("playBtn").onclick = togglePlay;
    $("tabEncoder").onclick = () => setMode("encoder");
    $("tabDecoder").onclick = () => setMode("decoder");
    $("aboutBtn").onclick = showAbout;
    $("testsBtn").onclick = showTests;
    $("modalClose").onclick = () => $("modalBack").classList.remove("show");
    $("modalBack").addEventListener("click", (ev) => {
      if (ev.target === $("modalBack")) $("modalBack").classList.remove("show");
    });
  }
  renderConfig();
  resetDecoder();
  recomputeEncoder();
  S.selTensor = STAGE_DEFAULT_TENSOR[stages()[0].id];
  initEvents();
  renderDynamic();
})();
</script>
</body>
</html>
